$sources:
  requests:
    url: GET /api/modules/machine/requests
    poll: 10s
  # The trusted machines (this one and its peers): the machine filter and the machines the admin machine asks for their requests.
  machines:
    url: GET /api/modules/machine/machines

# What the peers asked THIS machine to run, read from its audit log by the daemon (the reader of `machine requests`, decision 73), and, on the admin
# machine, the same for every OTHER trusted machine, loaded on demand (decision 74): the page signs a read-only requests-list per peer IN THE BROWSER
# with the admin passphrase (asked each time, never stored); the daemon forwards it and the peer answers like it does to `machine requests <machine>`.
# Pending = refused because the command is not allowed (a command the policy allows now is not listed). Ages are humanized by the route. No code columns.
# Held requests (`machine run --wait`) come first, with a countdown, for every machine loaded. Each row has an Allow button (decision 76) on the admin
# machine in policy mode admin: it does what `machine admin allow` does for the machine the row belongs to, with the admin passphrase and the unlocked key
# ONLY in the browser (machine:RequestsOverview, confirmation modal, signature in the page, only the signed documents posted). Elsewhere (no admin key
# here, mode local) the row shows the CLI command instead and the capability note says why. Deny is a button for this machine's own rows; for a request
# held on another machine the row says where to run it (a remote Deny is not built). Notices (request-notices.md, phase 2): held or refused requests that
# OTHER machines reported are listed in the same sections without a passphrase, labelled with the machine that reported them; the 10s poll above refreshes them. History stays read-only and local (the CLI shows it).
$type: PageContent
sections:
  - $type: PageHeader
    title: Requests
    subtitle: Commands that peers asked to run, on this machine and, from the admin machine, on the others. Allow signs the new policy here, in your browser, with the admin passphrase.
  - $type: Card
    $if: $sources.requests.chainText
    padding: sm
    items:
      - $type: Markdown
        text: $sources.requests.chainText
  - $type: Card
    padding: sm
    items:
      - $type: Markdown
        text: $sources.requests.remoteNote
  - $type: machine:RequestsOverview
    self: $sources.requests.machine
    machines: $sources.machines.machines
    held: $sources.requests.waiting
    pending: $sources.requests.pending
    allow: $sources.requests.allow
    remote: $sources.requests.remote
    notices: $sources.requests.notices
    noticesError: $sources.requests.noticesError
    emptyMessage: $sources.requests.emptyMessage
  - $type: Markdown
    text: "### History of this machine"
  - $type: DataTable
    rows: $sources.requests.history
    emptyMessage: No entry in the audit log
    columns:
      - { key: "whenText", label: "When", nowrap: true }
      - { key: "peerText", label: "From", nowrap: true }
      - { key: "kind", label: "Kind", nowrap: true }
      - { key: "text", label: "What" }
