$sources:
  requests:
    url: GET /api/modules/machine/requests
    poll: 10s

# What the peers asked THIS machine to run, read from its audit log by the daemon (the reader of `machine requests`, decision 73).
# Pending = refused because the command is not allowed (a command the policy allows now is not listed). Ages are humanized by the route. No code columns.
# Each pending row has an Allow button (decision 76) on the admin machine in policy mode admin: it does what `machine admin allow` does, with the admin
# passphrase and the unlocked key ONLY in the browser (machine:AllowRequestsTable, confirmation modal, signature in the page, only the signed documents
# posted). Elsewhere (no admin key here, mode local) the row shows the CLI command instead and `allow.note` says why. History stays read-only.
# The requests of OTHER machines are listed by `machine requests <machine>` on the admin machine; the page cannot ask a peer yet (see remoteNote).
$type: PageContent
sections:
  - $type: PageHeader
    title: Requests
    subtitle: Commands that peers asked this machine to run. On the admin machine, Allow signs the new policy here, in your browser, with the admin passphrase.
  - $type: Card
    $if: $sources.requests.chainText
    padding: sm
    items:
      - $type: Markdown
        text: $sources.requests.chainText
  - $type: Card
    padding: sm
    items:
      - $type: Markdown
        text: $sources.requests.remoteNote
  # Held requests (`machine run --wait`): a caller waits for the answer. Allow signs in the browser like the table below, Deny signs nothing and asks no
  # passphrase. The component draws its own heading and nothing at all when no request is held. The countdown runs in the page between two polls.
  - $type: machine:HeldRequests
    rows: $sources.requests.waiting
    allow: $sources.requests.allow
  - $type: Markdown
    text: "### Waiting for approval"
  - $type: machine:AllowRequestsTable
    rows: $sources.requests.pending
    allow: $sources.requests.allow
    emptyMessage: $sources.requests.emptyMessage
  - $type: Markdown
    text: "### History"
  - $type: DataTable
    rows: $sources.requests.history
    emptyMessage: No entry in the audit log
    columns:
      - { key: "whenText", label: "When", nowrap: true }
      - { key: "peerText", label: "From", nowrap: true }
      - { key: "kind", label: "Kind", nowrap: true }
      - { key: "text", label: "What" }
