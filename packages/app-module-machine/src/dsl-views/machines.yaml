$sources:
  machines:
    url: GET /api/modules/machine/machines
    # The Reachable column comes from the probe of the daemon (every 30 s while somebody asks): the page asks again to follow it.
    poll: 10s

$type: PageContent
sections:
  - $type: PageHeader
    title: Machines
    subtitle: This machine and the peers it trusts, as the local machine daemon knows them. Read-only.
  # The route answers `note` when this machine is not enrolled yet, and `presenceNote` for what the list cannot show.
  - $type: Card
    $if: $sources.machines.note
    padding: sm
    items:
      - $type: Markdown
        text: $sources.machines.note
  - $type: Card
    $if: $sources.machines.presenceNote
    padding: sm
    items:
      - $type: Markdown
        text: $sources.machines.presenceNote
  # Who receives request notices (decisions 83, 84): the sentence when a list is known, and the fix when the daemon cannot tell.
  - $type: Card
    $if: $sources.machines.noticesText
    padding: sm
    items:
      - $type: Markdown
        text: $sources.machines.noticesText
  - $type: Card
    $if: $sources.machines.noticesNote
    padding: sm
    items:
      - $type: Markdown
        text: $sources.machines.noticesNote
  # Which machines the admin machine reaches DIRECTLY (decision 86): a document goes straight to them; the others get it through the relay inbox.
  - $type: Card
    $if: $sources.machines.reachableNote
    padding: sm
    items:
      - $type: Markdown
        text: $sources.machines.reachableNote
  - $type: DataTable
    rows: $sources.machines.machines
    emptyMessage: No machine
    columns:
      - { key: "name", label: "Name", nowrap: true }
      - { key: "role", label: "Role", nowrap: true }
      - { key: "aliasesText", label: "Aliases" }
      - { key: "reachable", label: "Reachable" }
      - { key: "receivesNotices", label: "Receives notices", nowrap: true }
      - { key: "listHeldText", label: "Notice list held" }
      - { key: "uuid", label: "UUID", nowrap: true }
