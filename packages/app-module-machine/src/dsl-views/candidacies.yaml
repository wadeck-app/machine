$sources:
  candidacies:
    url: GET /api/modules/machine/candidacies
    poll: 30s

# One component for the timeline and the table (machine:CandidaciesTable): the approval dialog lays what the page proves over the steps of the module, so both
# share its state. Approve signs IN THE BROWSER with the admin passphrase asked at every approval (admin-ui.md, "Approve from the page"); Reject is the standard
# action below, called by name from the component (a restricting action: no signature, no passphrase; the route is sensitive, the app-core PIN is asked by the shell).
$actions:
  reject:
    url: POST /api/modules/machine/candidacies/{id}/reject
    confirm: Reject this candidacy? The machine is refused and must post a new candidacy (machine join --resume) to ask again.
    reloadSources: [candidacies]
    errorPrefix: Could not reject the candidacy

# The route computes the steps (texts and statuses, candidacyTimeline.ts) from the relay data of the oldest pending candidacy and marks a step done only when that
# data proves it. Decision 55: the candidacy code is not displayed (the human compares the security code after signing). The route still answers `code`, recomputed by
# the module from the key and random it received, never the one the relay sends; the approval dialog recomputes it again in the page and refuses on a mismatch.
$type: PageContent
sections:
  - $type: PageHeader
    title: Candidacies
    subtitle: Machines that asked to join the network, listed by the relay with the admin token of this machine. Approve signs in your browser with the admin passphrase (asked at every approval, never kept or sent), then tells the other machines; Reject refuses the candidate. The terminal alternative is `machine admin approve`.
  # The candidacy the timeline follows (the oldest pending one) and what the relay says about it.
  - $type: Card
    $if: $sources.candidacies.timelineNote
    padding: sm
    items:
      - $type: Markdown
        text: $sources.candidacies.timelineNote
  - $type: machine:CandidaciesTable
    rows: $sources.candidacies.candidacies
    timeline: $sources.candidacies.timeline
    approvals: $sources.candidacies.approvals
    approvalsProblem: $sources.candidacies.approvalsProblem
    emptyMessage: No pending candidacy
