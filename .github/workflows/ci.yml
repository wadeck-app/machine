name: CI

# Tests only, never publishes (publish.yml does, on manual dispatch).
# Windows is the developer platform and macOS/Linux are published targets: the tests run on all three, as the siblings do.
on:
    push:
        branches: [main]
    pull_request:

# Read-only: the @wadeck-app packages are read with the run token. (The siblings give packages: write to every job because
# their single workflow publishes; this one does not.)
permissions:
    contents: read
    packages: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                # windows-latest defaults to PowerShell; Git Bash ships on the runner.
                shell: bash
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'
                  cache: npm

            # Same patch as publish.yml: the launcher tests (src/launcherGo.test.ts) build the Go launcher.
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26.8'

            - name: Install dependencies
              run: npm ci --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test
