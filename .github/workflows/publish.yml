name: CI / Publish

# Pull requests and pushes to main run the tests on three OS. A push to main, or a manual dispatch on main, then publishes:
# every push to main publishes an edge build, a dispatch can set a stable version. The version comes from compute-version, not from a tag.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0). Empty = CalVer edge build'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

# Read-only by default: the @wadeck-app packages are read with the run token. Only the publish job can write.
permissions:
    contents: read
    packages: read

# One run per ref at a time, in push order. A run is never cancelled on main or on a dispatch (a half-finished publish would leave
# the registry inconsistent); a pull request run is cancelled by a newer push to the same pull request.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Windows is the developer platform and macOS/Linux are published targets: the tests run on all three.
    build-and-test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        # Without it a hung job runs for 6 hours. TODO(user): the duration of this job per OS is not measured yet; adjust after the first runs.
        timeout-minutes: 20
        defaults:
            run:
                # windows-latest defaults to PowerShell; Git Bash ships on the runner.
                shell: bash
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'
                  cache: npm

            # The launcher tests (src/launcherGo.test.ts) build the Go launcher. Same patch as the publish job.
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26.8'

            - name: Install dependencies
              run: npm ci --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # The launcher tests run Go with GOPROXY=off (offline by design): fetch the modules of the SDK launcher once, here.
            # The Windows job failed with "module lookup disabled by GOPROXY=off" for golang.org/x/sys on a fresh runner.
            - name: Download Go modules of the launcher
              run: go mod download
              working-directory: node_modules/@wadeck-app/singleton-daemon-kit/go-launcher

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

    publish:
        needs: [build-and-test]
        # Only main publishes: a pull request, or a dispatch on a branch or a tag, must not.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        # TODO(user): GitHub Packages access for the four new package names (@wadeck-app/machine-cli and its three platform packages)
        # is unproven for this repo: the first run decides (packaging.md section 5, 9.10).
        permissions:
            contents: read
            packages: write
        env:
            PKG_OUT: ${{ github.workspace }}/dist-packages
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'
                  cache: npm

            # Patch-pinned: a new Go patch changes every launcher hash, which republishes the three platform packages
            # (hash-reuse) and moves the exact pin a rollback needs. Bump it on purpose, together with the matrix job.
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26.8'

            - name: Install dependencies
              run: npm ci --prefer-offline
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            # The launcher kit's build.sh embeds the Windows PE metadata with goversioninfo; with LAUNCHER_REQUIRE_PE_METADATA=1 a
            # missing tool fails the build instead of warning. No sibling workflow installs it.
            # Pinned to v1.7.0, the version of the binary on the development machine (go version -m).
            - name: Install goversioninfo
              run: |
                  go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: Build Go launchers
              run: bash packages/machine-cli/ci/scripts/build-launcher.sh
              env:
                  LAUNCHER_REQUIRE_PE_METADATA: '1'

            # go build sets the exec bit on Linux; make it explicit and check it, so a step that dropped it fails here and not on a Mac.
            - name: Set and check the exec bit of the Unix launchers
              run: |
                  fail=0
                  for f in packages/machine-cli/dist-launcher/darwin-arm64/machine packages/machine-cli/dist-launcher/linux-x64/machine; do
                    test -f "$f" || { echo "[fail] $f not built" >&2; fail=1; continue; }
                    chmod +x "$f"
                    test -x "$f" || { echo "[fail] $f has no exec bit" >&2; fail=1; }
                  done
                  test -f packages/machine-cli/dist-launcher/win32-x64/machine.exe || { echo "[fail] machine.exe not built" >&2; fail=1; }
                  test "$fail" = 0

            # BUNDLE_VERSION is inlined in the bundles (the updater refuses a non-CalVer build) and stamped in the app-module manifest.
            - name: Bundle (machine.cjs, machine-updater.cjs, app-module)
              run: npm run bundle:all
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            # What gets published must know its version, or the auto-update of the installed CLIs would loop on it.
            # `machine --version` reads the stamped version only: no config folder, no daemon, no network.
            - name: Verify the generated bundle prints the stamped version
              run: |
                  expected="${{ steps.version.outputs.version }}"
                  actual="$(node dist/machine.cjs --version)"
                  if [ "$actual" != "$expected" ]; then
                    echo "::error::machine.cjs --version printed '$actual', expected '$expected'"
                    exit 1
                  fi

            # Strict by default: a missing launcher, machine-updater.cjs or app-module/ is an error.
            - name: Generate the packages
              run: node packages/machine-cli/ci/scripts/generate-platform-packages.mjs --out "$PKG_OUT" --version "${{ steps.version.outputs.version }}"

            # Nothing is published here: file list of the four packages, then the exec bit INSIDE the tarballs
            # (same check as the queue workflow; a launcher or shim packed as 0644 gives EACCES on macOS and Linux).
            - name: Packed smoke (file lists and exec bits)
              run: |
                  out="$(mktemp -d)"
                  for d in "$PKG_OUT"/*/; do
                    echo "--- $(basename "$d")"
                    (cd "$d" && npm pack --dry-run)
                  done
                  for d in machine-cli-dist machine-cli-darwin-arm64 machine-cli-linux-x64; do
                    (cd "$PKG_OUT/$d" && npm pack --silent --pack-destination "$out" >/dev/null)
                  done
                  fail=0
                  count=0
                  for t in "$out"/*.tgz; do
                    for line in $(tar -tvzf "$t" | grep -E 'package/(machine|bin/machine\.js)$' | awk '{print $1 "@" $NF}'); do
                      count=$((count + 1))
                      mode="${line%%@*}"
                      case "$mode" in *x*x*x*) echo "ok   $mode ${line#*@} ($(basename "$t"))" ;; *) echo "FAIL $mode ${line#*@} ($(basename "$t")): no exec bit" >&2; fail=1 ;; esac
                    done
                  done
                  # 3 executables expected: machine (darwin), machine (linux), bin/machine.js (wrapper)
                  test "$count" = 3 || { echo "[fail] expected 3 executables in the tarballs, found $count" >&2; fail=1; }
                  test "$fail" = 0

            # Reads the registry, publishes the three platform packages only when the launcher bytes changed (else checks all three
            # are already published), then pins the exact versions into the wrapper. It does not publish the wrapper.
            - name: Publish platform packages (hash-reuse) and pin the wrapper
              run: node packages/machine-cli/ci/scripts/publish-platform-packages.mjs --dir "$PKG_OUT" --build-version "${{ steps.version.outputs.version }}" --dist-tag "${{ steps.version.outputs.dist_tag }}" --publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish the wrapper
              working-directory: dist-packages/machine-cli-dist
              run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
